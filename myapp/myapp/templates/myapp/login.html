{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} | NAYUN 4D</title>
    <style>
        body { background-color: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .box { background: rgba(255,255,255,0.05); border: 2px solid #bd93f9; border-radius: 20px; padding: 40px; display: inline-block; box-shadow: 0 0 20px #bd93f9; }
        input { background: #000; color: #fff; border: 1px solid #bd93f9; padding: 10px; margin: 10px 0; border-radius: 10px; width: 80%; }
        button { background: linear-gradient(45deg, #a18cd1, #6a11ff); color: white; border: none; padding: 12px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔮 {{ title }} 🔓</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">確認召喚進門</button>
        </form>
        <br><a href="{% url 'index' %}" style="color: #00f2fe; text-decoration: none;">🔙 返回 4D 世界首頁</a>
    </div>
</body>
</html>
